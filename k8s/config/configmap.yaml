apiVersion: v1
kind: ConfigMap
metadata:
  name: notice-board-config
  namespace: digital-notice-board
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres-svc"
  DB_PORT: "5432"
  DB_NAME: "digital_notice_board"
  DB_SSL: "false"
  CORS_ORIGIN: "http://localhost:5173,http://localhost:5174,http://localhost:8080"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  AUTH_RATE_LIMIT_MAX_REQUESTS: "100"
