version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notice_board_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_123}
      POSTGRES_DB: ${DB_NAME:-digital_notice_board}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-digital_notice_board}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notice_board_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notice_board_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_123}
      DB_NAME: ${DB_NAME:-digital_notice_board}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_notice_board_sse_lab_exam_2026_at_least_32_chars}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:8080
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      AUTH_RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - notice_board_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notice_board_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - notice_board_net

volumes:
  pgdata:
    name: notice_board_pgdata

networks:
  notice_board_net:
    driver: bridge
