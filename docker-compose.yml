version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notice_board_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_123}
      POSTGRES_DB: ${DB_NAME:-digital_notice_board}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-digital_notice_board}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: notice_board_pgdata
